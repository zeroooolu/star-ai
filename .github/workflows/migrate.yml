name: One-time product migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate Star AI Distribution files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/zeroooolu/kanjian-distribution-products.git /tmp/source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/source/04-self-service-distribution/. .
          cp -R /tmp/source/api ./api
          grep -RIl '/04-self-service-distribution/' . --exclude-dir=.git | xargs -r sed -i 's#/04-self-service-distribution/#/#g'
          cat > README.md <<'EOF'
          # 星发 AI 发行版

          星发 AI 发行版独立产品仓库，由 `kanjian-distribution-products` 母仓拆分。

          ## 仓库内容

          - AI 音乐发行商业模型与定价策略
          - 渠道与 AI 内容政策
          - 单位经济模型与 UX 基础
          - AI 音乐发行前台与发行流程原型

          跨产品的总体架构、共享发行底座与跨产品决策继续维护在 `kanjian-distribution-products` 母仓。
          EOF
          cat > vercel.json <<'EOF'
          {
            "rewrites": [
              { "source": "/assets/star-logo.png", "destination": "https://star.kanjian.com/app/release/images/star-logo.png" },
              { "source": "/assets/platform-logos/:file", "destination": "https://raw.githubusercontent.com/zeroooolu/music-promotion/main/frontend/star-release/assets/platform-logos/:file" },
              { "source": "/", "destination": "/prototype-v1/index.html" },
              { "source": "/app", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/dashboard", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/releases", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/works", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/artists", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/analytics", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/earnings", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/billing", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/settings", "destination": "/prototype-v1/product-pages.html" },
              { "source": "/app/releases/new", "destination": "/prototype-v1/release.html" },
              { "source": "/platforms", "destination": "/prototype-v1/platforms.html" },
              { "source": "/platforms.html", "destination": "/prototype-v1/platforms.html" },
              { "source": "/pricing", "destination": "/prototype-v1/pricing.html" },
              { "source": "/pricing.html", "destination": "/prototype-v1/pricing.html" },
              { "source": "/release", "destination": "/prototype-v1/release.html" },
              { "source": "/release.html", "destination": "/prototype-v1/release.html" }
            ]
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate ai distribution from parent repository"
          git push origin HEAD:main
